name: Fetch Index Option Chains
   
on: 
  push:
    paths: 
      # - "dhan_folder/**"
      - "upstox_folder/**"
      - "requirements.txt"
      - ".github/workflows/fetch_option_chain.yml"

  # Every day at 04:00 IST (22:30 UTC previous day)
  schedule:
    - cron: "30 22 * * *"

  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------
      # Fetch Dhan Option Chain
      # -------------------------
      # - name: Fetch Index Option Chain
      #   run: python dhan_folder/fetch_index_option_chain.py
      #   env:
      #     AUTH_MONGO_URI: ${{ secrets.AUTH_MONGO_URI }}
      #     AUTH_MONGO_DB: ${{ secrets.AUTH_MONGO_DB }}
      #     AUTH_MONGO_COLLECTION: ${{ secrets.AUTH_MONGO_COLLECTION }}
 
      # -------------------------
      # Sync Upstox Instruments
      # -------------------------
      - name: Sync Upstox Instruments
        run: python upstox_folder/upstox_sync.py
        env:
          AUTH_MONGO_URI: ${{ secrets.AUTH_MONGO_URI }}
          AUTH_MONGO_DB: ${{ secrets.AUTH_MONGO_DB }}
          AUTH_MONGO_COLLECTION: ${{ secrets.AUTH_MONGO_COLLECTION }}

      # -------------------------
      # Run Upstox Strikes
      # -------------------------
      - name: Run Upstox Strikes
        working-directory: upstox_strikes
        env:
          MONGO_URI: ${{ secrets.AUTH_MONGO_URI }}
          # Add these only if your app uses them
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Optional flags
          TEST_RUN: "False"
          SAVE_RES: "False"

        run: |
          python -m app.main